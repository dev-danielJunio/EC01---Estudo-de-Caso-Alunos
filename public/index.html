<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
</head>

<body>
    <div id="header-container"></div>

    <main class="container">
        <h3>Formulário de Cadastro</h3>
        <form>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="mb-3">
                <label for="idade" class="form-label">Idade:</label>
                <input type="number" class="form-control" id="idade" name="idade" required>
            </div>
            <div class="mb-3">
                <label for="curso" class="form-label">Curso:</label>
                <input type="text" class="form-control" id="curso" name="curso" required>
            </div>
            <div class="mb-3">
                <label for="notaFinal" class="form-label">Nota Final:</label>
                <input type="number" class="form-control" id="notaFinal" name="notaFinal" required>
            </div>
            <button type="button" class="btn btn-primary" onclick="cadastrarAluno()">Cadastrar</button>
        </form>
    </main>

    <script>
        fetch('components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
            });
    </script>
<script type="module" src="../controllers/alunoController.js"></script>
</body>

</html>
